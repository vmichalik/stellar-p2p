[package]
name = "pactlane-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
ed25519-dalek = "=2.2.0"
serde_json = "=1.0.154"
hex = "=0.4.3"

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
